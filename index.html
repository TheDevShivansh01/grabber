<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Goober Grab</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--grape:#2e1065;--pink:#ff6fb5;--lime:#c6f432;--ink:#1b0a3c;--paper:#fff7fb}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--grape);font-family:Nunito,system-ui,sans-serif;color:var(--paper)}
body.playing,body.playing canvas{touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
#menu,#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 20% 20%,#5b21b6 0,transparent 45%),radial-gradient(circle at 85% 80%,#be185d 0,transparent 40%),var(--grape);overflow:auto}
.card{width:min(440px,100%);background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:28px;padding:24px;box-shadow:8px 8px 0 var(--ink);transform:rotate(-1deg)}
h1{font-family:'Bagel Fat One',cursive;font-size:3.2rem;line-height:.95;color:var(--pink);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);margin-bottom:6px}
.sub{font-weight:700;margin-bottom:16px}
input,select,button{font:inherit;font-weight:900;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;width:100%;background:#fff;color:var(--ink)}
button{cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--lime);outline-offset:2px}
.go{background:var(--lime)}.mk{background:var(--pink)}.jn{background:#7dd3fc}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
label{font-size:.85rem;display:block;margin-top:12px}
.big{margin-top:14px;font-size:1.15rem}
hr{border:0;border-top:3px dashed var(--ink);margin:18px 0 6px;opacity:.25}
#err{color:#c01048;font-weight:900;margin-top:10px;min-height:1.2em}
#hud{position:fixed;top:10px;left:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
#hud *{pointer-events:auto}
#code{background:var(--lime);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:6px 14px;font-family:'Bagel Fat One';font-size:1.3rem;letter-spacing:.12em;cursor:pointer;box-shadow:3px 3px 0 var(--ink);width:auto}
#hint{font-size:.8rem;font-weight:900;background:var(--ink);padding:3px 10px;border-radius:10px}
#lb{position:fixed;top:10px;right:10px;background:rgba(27,10,60,.85);border:3px solid var(--pink);border-radius:18px;padding:10px 12px;min-width:170px;font-weight:900;font-size:.9rem}
#lb div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}#lb .me{color:var(--lime)}
#feed{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%}
#feed span{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:5px 12px;font-weight:900;font-size:.9rem;animation:pop .25s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#dead{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bagel Fat One';font-size:clamp(2rem,8vw,4rem);text-align:center;color:var(--pink);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none}
@media(max-width:520px){h1{font-size:2.6rem}.card{padding:18px;transform:none}#lb{min-width:0;font-size:.75rem;padding:6px 8px;top:6px;right:6px}#code{font-size:1rem;padding:4px 10px}#hud{top:6px;left:6px}#hint{display:none}}
@media(prefers-reduced-motion:reduce){#feed span{animation:none}}
.mode{background:#fff;font-size:1.05rem}.mode.on{background:var(--lime)}
#res{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(27,10,60,.7);padding:16px}
#res>div{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:24px;padding:18px 22px;box-shadow:6px 6px 0 var(--ink);min-width:240px;font-weight:900}
#res h2{font-family:'Bagel Fat One';color:var(--pink);-webkit-text-stroke:1.5px var(--ink);margin-bottom:8px}
#res{overflow:hidden}#res .rw{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
.wc{text-align:center;position:relative;z-index:2}.wb{font-size:4.2rem;line-height:1;animation:hop .7s ease-in-out infinite alternate}.crown{font-size:2rem;margin-bottom:-12px}
.cf{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}@keyframes hop{to{transform:translateY(-14px) rotate(6deg)}}
@media(prefers-reduced-motion:reduce){.cf,.wb{animation:none}}
#lcode{font-family:'Bagel Fat One';font-size:3rem;letter-spacing:.15em;color:var(--pink);-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);text-align:center}
#lplist{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;max-height:34vh;overflow:auto}
.chip{border:3px solid var(--ink);border-radius:14px;padding:3px 10px;font-weight:900;color:var(--ink);font-size:.9rem}
#tm{background:var(--ink);padding:3px 10px;border-radius:10px;font-weight:900;font-size:.9rem}
#res>div{max-height:88vh;overflow:auto}
</style></head><body>
<canvas id="c"></canvas>
<div id="menu"><div class="card">
  <h1>Goober<br>Grab!</h1>
  <p class="sub" id="sub">Paint the map. Dodge the tails. Squish your friends. 🥔</p>
  <div class="row" id="modes"><button class="mode on" data-m="grab">🟣 Grabber</button><button class="mode" data-m="race">🛷 Racer</button></div>
  <label for="name">Your goober name</label>
  <input id="name" maxlength="14" placeholder="Sir Potato">
  <button class="go big" id="pub">🌍 Play Online (with bots)</button>
  <hr>
  <label>Make a private room for friends</label>
  <div class="row">
    <select id="max" aria-label="Max players"></select>
    <select id="bots" aria-label="Bots"><option value="0">No bots</option><option value="1">1 bot</option><option value="2">2 bots</option><option value="3">3 bots</option></select>
  </div>
  <button class="mk big" id="mk">🎈 Create Room</button>
  <label for="jc">Got a room code?</label>
  <div class="row"><input id="jc" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"><button class="jn" id="jn">Join</button></div>
  <div id="err" role="alert"></div>
</div></div>
<div id="lobby" class="hide"><div class="card"><h1 style="font-size:2.2rem">Waiting Room</h1><div class="sub">Share this code with friends:</div><div id="lcode"></div><div class="sub" id="lcount" style="text-align:center;margin:8px 0 0"></div><div id="lplist"></div>
<button class="go big" id="lstart">▶ Start Match</button><p id="lwait" class="sub hide" style="text-align:center;margin:10px 0 0">Waiting for the host to start… ⏳</p>
<div class="row"><button class="jn" id="linvite">📤 Invite</button><button id="lleave">🚪 Leave</button></div></div></div>
<div id="hud" class="hide"><button id="code" title="Tap to share invite link"></button><span id="tm" class="hide"></span><span id="hint">Arrows / WASD / swipe</span></div>
<div id="lb" class="hide"></div><div id="feed"></div><div id="res" class="hide"></div><div id="dead" class="hide">SQUISHED!<br>respawning…</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),cx=cv.getContext('2d');
const COL=['','#ff4d6d','#4dabf7','#ffd43b','#51cf66','#b197fc','#ff922b','#22d3c5','#f06595','#a9e34b','#868e96','#e64980','#15aabf','#fab005','#82c91e','#845ef7','#fd7e14','#12b886','#339af0','#be4bdb','#495057'];
const CS=30,TICK=125;let ws,me=0,W=50,H=50,owner=new Uint8Array(2500),trail=new Uint8Array(2500),pl={},joined=false,shake=0,leader=0,cam={x:25,y:25,i:0},mode='grab',curCode='',lastLobby='';
function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const race=m==='race',mx=20,bm=race?2:3;$('max').innerHTML='';$('bots').innerHTML='';
  for(let i=2;i<=mx;i++)$('max').add(new Option(i+' players',i,i===4,i===4));
  for(let i=0;i<=bm;i++)$('bots').add(new Option(i?i+(i>1?' bots':' bot'):'No bots',i));
  $('pub').textContent='🌍 Play Online (with '+bm+' bots)';
  $('sub').textContent=race?'Slide downhill, dodge trees, grab fish. Farthest wins! 🛷':'Paint the map. Dodge the tails. Squish your friends. 🥔'}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode('grab');
const esc=t=>String(t).replace(/[<&]/g,c=>c==='<'?'&lt;':'&amp;');
$('name').value=localStorage.getItem('gg-name')||'';
const q=new URLSearchParams(location.search).get('room');if(q)$('jc').value=q.toUpperCase();
function connect(first){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>ws.send(JSON.stringify(first));
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='err'){$('err').textContent=m.m;ws.close();return}
    if(m.t==='joined'){me=m.id;mode=m.mode||'grab';curCode=m.code;R.pub=m.pub;joined=true;$('menu').classList.add('hide');
      $('hint').textContent=mode==='race'?'Hold left / right side to steer':'Arrows / WASD / swipe';
      $('code').textContent='Room '+m.code+' 📋';history.replaceState(null,'','?room='+m.code)}
    if(m.t==='lobby')showLobby(m);if(m.t==='end')onEnd(m)
    if(m.t==='s')update(m);if(m.t==='r')updateRace(m)};
  ws.onclose=()=>{if(joined)location.reload()};
}
function start(msg){const n=$('name').value.trim()||'Goober';localStorage.setItem('gg-name',n);$('err').textContent='';connect({...msg,name:n,mode})}
$('pub').onclick=()=>start({t:'public'});
$('mk').onclick=()=>start({t:'create',max:+$('max').value,bots:+$('bots').value});
$('jn').onclick=()=>{const c=$('jc').value.trim();c.length===4?start({t:'join',code:c}):$('err').textContent='Room codes have 4 letters.'};
async function share(){const url=location.origin+'/?room='+curCode;try{if(navigator.share)await navigator.share({title:'Goober Grab',text:'Join my room! Code: '+curCode,url});else{await navigator.clipboard.writeText(url);toast('Invite link copied! Send it to your friends 🎉')}}catch(e){}}
$('code').onclick=share;$('linvite').onclick=share;$('lleave').onclick=()=>{location.href=location.pathname};$('lstart').onclick=()=>ws.send(JSON.stringify({t:'start'}));
function toast(t){const s=document.createElement('span');s.textContent=t;$('feed').append(s);setTimeout(()=>s.remove(),4000);while($('feed').children.length>3)$('feed').firstChild.remove()}
function update(m){
  scr('game');onEnd.on=0;tmr(m.tl);
  const g=atob(m.g);for(let i=0;i<2500;i++){owner[i]=g.charCodeAt(i);trail[i]=g.charCodeAt(2500+i)}
  const now=performance.now();
  for(const p of m.p){const o=pl[p.i];
    if(o&&o.a&&p.a&&Math.abs(o.rx-p.x)+Math.abs(o.ry-p.y)<=4){p.rx=o.rx;p.ry=o.ry}else{p.rx=p.x;p.ry=p.y}
    pl[p.i]=p;
    if(p.i===me){$('dead').classList.toggle('hide',!!p.a);if(!p.a)shake=0}}
  for(const k in pl)if(!m.p.find(p=>p.i==k))delete pl[k];
  m.f.forEach(toast);
  const top=[...m.p].sort((a,b)=>b.s-a.s);leader=top[0].s>0?top[0].i:0;
  lbShow(top.map(p=>({i:p.i,t:(p.i===leader?'👑':p.e)+' '+esc(p.n),v:p.s+'%'})));
}
function dir(d){if(joined&&mode==='grab'&&ws.readyState===1)ws.send(JSON.stringify({t:'dir',d}))}
const K={ArrowUp:0,w:0,ArrowRight:1,d:1,ArrowDown:2,s:2,ArrowLeft:3,a:3};
addEventListener('keydown',e=>{if(e.key in K&&joined){e.preventDefault();if(mode==='race'){if(K[e.key]===3)rk.l=1;if(K[e.key]===1)rk.r=1}else dir(K[e.key])}});
addEventListener('keyup',e=>{if(K[e.key]===3)rk.l=0;if(K[e.key]===1)rk.r=0});
const ts=e=>{if(mode==='race'&&joined)steer=e.touches.length?(e.touches[0].clientX<innerWidth/2?-1:1):0};
['touchstart','touchmove','touchend','touchcancel'].forEach(n=>addEventListener(n,ts,{passive:true}));
let t0;addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
addEventListener('touchmove',e=>{if(!t0||!joined||mode!=='grab')return;const t=e.touches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))>14){dir(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));t0=t}},{passive:true});
function resize(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
addEventListener('resize',resize);resize();
function draw(){
  requestAnimationFrame(draw);
  const w=innerWidth,h=innerHeight,now=performance.now();
  if(mode==='race'){drawRace(w,h,now);return}
  cx.fillStyle='#2e1065';cx.fillRect(0,0,w,h);
  const dt=Math.min(50,now-(draw.l||now));draw.l=now;const st=dt/TICK*1.08;
  for(const k in pl){const p=pl[k];p.rx+=Math.max(-st,Math.min(st,p.x-p.rx));p.ry+=Math.max(-st,Math.min(st,p.y-p.ry))}
  const m=pl[me]||{rx:W/2,ry:H/2};
  if(!cam.i&&pl[me]){cam.x=m.rx;cam.y=m.ry;cam.i=1}
  const kk=1-Math.exp(-dt/110);cam.x+=(m.rx-cam.x)*kk;cam.y+=(m.ry-cam.y)*kk;
  const mob=matchMedia('(pointer:coarse)').matches||w<700;
  const sc=mob?Math.min(1.6,Math.max(.9,Math.min(w,h)/(11*CS))):Math.min(1,Math.max(.55,Math.min(w,h)/700));
  cx.save();cx.translate(w/2,h/2);cx.scale(sc,sc);cx.translate(-(cam.x+.5)*CS,-(cam.y+.5)*CS);
  cx.fillStyle='#ff6fb5';cx.fillRect(-14,-14,W*CS+28,H*CS+28);
  cx.fillStyle='#fff7fb';cx.fillRect(0,0,W*CS,H*CS);
  cx.fillStyle='#f3e8ff';for(let y=0;y<H;y++)for(let x=(y&1);x<W;x+=2)cx.fillRect(x*CS,y*CS,CS,CS);
  for(let i=0;i<W*H;i++){const o=owner[i],t=trail[i];if(!o&&!t)continue;const x=(i%W)*CS,y=((i/W)|0)*CS;
    if(o){cx.fillStyle=COL[o];cx.fillRect(x,y,CS,CS);cx.fillStyle='rgba(255,255,255,.18)';cx.fillRect(x+3,y+3,CS-6,CS-6)}
    if(t){cx.fillStyle=COL[t];cx.globalAlpha=.55;cx.fillRect(x+4,y+4,CS-8,CS-8);cx.globalAlpha=1;cx.fillStyle='#fff';cx.beginPath();cx.arc(x+CS/2,y+CS/2,3,0,7);cx.fill()}}
  cx.lineWidth=5;cx.strokeStyle='#1b0a3c';cx.strokeRect(0,0,W*CS,H*CS);
  cx.textAlign='center';cx.textBaseline='middle';
  for(const k in pl){const p=pl[k];if(!p.a)continue;const x=(p.rx+.5)*CS,y=(p.ry+.5)*CS,b=Math.sin(now/110+p.i)*2;
    cx.fillStyle=COL[p.i];cx.strokeStyle='#1b0a3c';cx.lineWidth=3;cx.beginPath();cx.arc(x,y+b,CS*.62,0,7);cx.fill();cx.stroke();
    cx.font=(CS*.8)+'px serif';cx.fillText(p.e,x,y+b+1);
    const L=p.i===leader,ny=y-(L?CS*1.55:CS);
    if(L){cx.font=(CS*.9)+'px serif';cx.save();cx.translate(x,y+b-CS*.85);cx.rotate(Math.sin(now/260)*.18);cx.fillText('👑',0,0);cx.restore()}
    cx.font='900 13px Nunito';cx.lineWidth=4;cx.strokeStyle='#1b0a3c';cx.strokeText((p.b?'🤖 ':'')+p.n,x,ny);cx.fillStyle='#fff';cx.fillText((p.b?'🤖 ':'')+p.n,x,ny)}
  cx.restore();
}


function scr(n){$('menu').classList.add('hide');const g=n==='game';$('lobby').classList.toggle('hide',g);$('hud').classList.toggle('hide',!g);$('lb').classList.toggle('hide',!g);
  if(!g){$('dead').classList.add('hide');$('res').classList.add('hide')}document.body.classList.toggle('playing',g)}
function lbShow(rows){const v=rows.slice(0,7).map((r,i)=>({...r,k:i+1})),mi=rows.findIndex(r=>r.i===me);if(mi>=7)v.push({...rows[mi],k:mi+1});
  $('lb').innerHTML=v.map(r=>`<div class="${r.i===me?'me':''}"><span>${rows.length>7?r.k+'. ':''}${r.t}</span><span>${r.v}</span></div>`).join('')}
function tmr(tl){const t=$('tm');if(!tl){t.classList.add('hide');return}const s=Math.ceil(tl/1000);t.classList.remove('hide');t.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function showLobby(m){scr('lobby');onEnd.on=0;R.ph='';mode=m.mode;const key=JSON.stringify(m);if(key===lastLobby)return;lastLobby=key;
  const host=m.host===me,need=m.mode==='race'?1:2;$('lcode').textContent=m.code;
  $('lcount').textContent=m.p.length+'/'+m.max+' in room · '+(m.mode==='race'?'🛷 Racer':'🟣 Grabber');
  $('lplist').innerHTML=m.p.map(p=>`<span class="chip" style="background:${COL[p.i]}">${p.e} ${esc(p.n)}${p.i===m.host?' ⭐':''}${p.b?' 🤖':''}</span>`).join('');
  $('lstart').classList.toggle('hide',!host);$('lwait').classList.toggle('hide',host);$('lstart').disabled=m.p.length<need;
  $('lstart').textContent=m.p.length<need?'Need at least '+need+' players':'▶ Start Match'}
function showRes(rows,label){const w=rows[0];if(!w)return;const mine=w.i===me,res=$('res');
  const conf=Array.from({length:40},()=>`<span class="cf" style="left:${Math.random()*100}%;animation-duration:${2.5+Math.random()*3}s;animation-delay:${Math.random()*1.5}s">${['🎉','🎊','✨','⭐','🐟'][Math.floor(Math.random()*5)]}</span>`).join('');
  res.innerHTML=conf+`<div class="wc"><div class="crown">👑</div><div class="wb">${w.e}</div><h2>${mine?'YOU WIN! 🥇':esc(w.n)+' WINS!'}</h2><p style="font-size:1.2rem">${w.v}</p><hr style="margin:8px 0;opacity:.3">${rows.map((p,i)=>`<div class="rw"><span>${i+1}. ${p.e} ${esc(p.n)}</span><span>${p.v}</span></div>`).join('')}<p style="margin-top:10px;font-size:.85rem">${label} <b id="nx">…</b>s…</p></div>`;res.classList.remove('hide')}
function onEnd(m){scr('game');$('dead').classList.add('hide');$('tm').classList.add('hide');
  if(!onEnd.on){onEnd.on=1;showRes(m.p.map(p=>({i:p.i,n:p.n,e:p.e,v:p.s+'%'})),'Back to the room in')}
  const e=$('nx');if(e)e.textContent=Math.ceil(m.tl/1000)}
// ---------- RACER ----------
const RW=9,RMS=45000,RP={};let steer=0,rk={l:0,r:0},R={ph:'',tl:0,tr:0,seed:1,list:[],me:null,rank:[]},cc=new Map();
const fresh=x=>({x,d:0,v:0,vx:0,st:0,bo:0,air:0,at:0,hit:new Set(),got:new Set(),sent:0});let mr=fresh(0);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function chunk(k){if(cc.has(k))return cc.get(k);const r=rng(R.seed*31+k*7919),a=[];
  if(k>=4){const n=r()<.35?2:1;for(let i=0;i<n;i++)if(r()<.85){const u=r();a.push({id:k*3+i,x:r()*1.8-.9,d:k*5+r()*4,t:u<.36?'🌲':u<.48?'🪨':u<.58?'⛄':u<.7?'🐟':u<.85?'S':'J'})}}
  cc.set(k,a);return a}
const dd=p=>p.i===me?Math.max(p.d,mr.d):p.d;
// realistic snow texture (seamless tile)
let snow;function makeSnow(){const S=512,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d'),r=rng(7);
  g.fillStyle='#eef6ff';g.fillRect(0,0,S,S);
  for(let i=0;i<150;i++){const x=r()*S,y=r()*S,rad=18+r()*70,al=.05+r()*.1,col=r()<.5?'120,170,230':'255,255,255';
    for(const dx of[-S,0,S])for(const dy of[-S,0,S]){const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,rad);gr.addColorStop(0,`rgba(${col},${al})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(x+dx-rad,y+dy-rad,rad*2,rad*2)}}
  for(let i=0;i<300;i++){g.fillStyle=r()<.7?`rgba(255,255,255,${.5+r()*.5})`:'rgba(140,180,225,.3)';g.fillRect(r()*S,r()*S,1+r()*2,1+r()*2)}
  return c}
const flakes=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),s:Math.random()}));
const hs=n=>{const v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v)};
function showWin(s){showRes(s.map(p=>({i:p.i,n:p.n,e:p.e,v:Math.round(dd(p))+'m'})),R.pub?'Next race in':'Back to the room in')}
function updateRace(m){
  scr('game');const prev=R.ph;R.ph=m.ph;R.tl=m.tl;R.tr=performance.now();R.list=m.p;R.me=m.p.find(p=>p.i===me)||null;
  if(m.seed!==R.seed){R.seed=m.seed;cc.clear()}
  if(m.ph==='count'&&prev!=='count')mr=fresh(R.me?R.me.x:0);
  for(const p of m.p)if(!RP[p.i]||m.ph==='count')RP[p.i]={x:p.x,d:p.d};
  const s=m.p.filter(p=>!p.w).sort((a,b)=>dd(b)-dd(a));R.rank=s;
  lbShow(s.map(p=>({i:p.i,t:(s[0]===p&&dd(p)>5?'👑':p.e)+' '+esc(p.n),v:Math.round(dd(p))+'m'})));
  if(m.ph==='result'){if(prev!=='result')showWin(s);const e=$('nx');if(e)e.textContent=Math.ceil((m.tl+(R.pub?5000:0))/1000)}else $('res').classList.add('hide');
}
function simRace(s){
  if(R.ph!=='run'||!R.me||R.me.w)return;
  const mx=mr.bo>0?22:14,st=steer||(rk.r-rk.l);
  if(mr.st>0){mr.st-=s;mr.v+=(3-mr.v)*Math.min(1,s*6)}else mr.v=mr.v<mx?Math.min(mx,mr.v+8*s):Math.max(mx,mr.v-8*s);
  mr.bo-=s;mr.vx+=((mr.st>0?0:st*1.7)-mr.vx)*Math.min(1,s*9);mr.x=cl(mr.x+mr.vx*s,-.94,.94);mr.d+=mr.v*s;
  if(mr.air){mr.at+=s;if(mr.at>=1.1)mr.air=0}
  const k=Math.floor(mr.d/5);
  for(let j=k-1;j<=k+1;j++)for(const o of chunk(j)){if(Math.abs(o.d-mr.d)>1||mr.got.has(o.id)||mr.hit.has(o.id))continue;const dx=Math.abs(o.x-mr.x);
    if(o.t==='🐟'&&dx<.22&&Math.abs(o.d-mr.d)<.7){mr.got.add(o.id);mr.bo=1.6;mr.v=Math.max(mr.v,17)}
    else if(o.t==='S'&&dx<.3){mr.got.add(o.id);mr.bo=2.2;mr.v=Math.max(mr.v,21)}
    else if(o.t==='J'&&dx<.28&&!mr.air){mr.got.add(o.id);mr.air=1;mr.at=0;mr.v=Math.max(mr.v,17)}
    else if(!mr.air&&o.t!=='🐟'&&o.t!=='S'&&o.t!=='J'&&dx<.22&&Math.abs(o.d-mr.d)<.7){mr.hit.add(o.id);mr.st=.7;mr.v*=.3}}
  const n=performance.now();if(n-mr.sent>80&&ws.readyState===1){mr.sent=n;ws.send(JSON.stringify({t:'pos',x:+mr.x.toFixed(3),d:+mr.d.toFixed(1),c:mr.st>0?1:0,j:mr.air?1:0}))}
}
function txt(t,x,y,sz,col){cx.font=sz+'px "Bagel Fat One",cursive';cx.lineWidth=sz/7;cx.strokeStyle='#1b0a3c';cx.fillStyle=col||'#c6f432';cx.strokeText(t,x,y);cx.fillText(t,x,y)}
function drawRace(w,h,now){
  if(!snow)snow=makeSnow();
  const dt=Math.min(50,now-(drawRace.l||now));drawRace.l=now;simRace(dt/1000);
  const k=Math.min(1,dt/90);for(const p of R.list){const o=RP[p.i];if(o){o.d+=(p.d-o.d)*k;o.x+=(p.x-o.x)*k}}
  const tw=Math.min(w*.94,520),pm=tw/RW,L=(w-tw)/2,py=h*.72,md=mr.d,mid=w/2,bank=Math.max(30,L);
  const dmin=md-(h-py)/pm,dmax=md+py/pm;
  // backdrop: dusk gradient + snowy banks
  let g=cx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#16315c');g.addColorStop(1,'#3b6aa0');cx.fillStyle=g;cx.fillRect(0,0,w,h);
  for(const sd of[-1,1]){const x0=sd<0?L-bank:L+tw,gr=cx.createLinearGradient(x0,0,x0+bank,0);
    if(sd<0){gr.addColorStop(0,'#9fc0e4');gr.addColorStop(1,'#e8f3ff')}else{gr.addColorStop(0,'#e8f3ff');gr.addColorStop(1,'#9fc0e4')}
    cx.fillStyle=gr;cx.fillRect(x0,0,bank,h)}
  // snow lane
  cx.save();cx.beginPath();cx.rect(L,0,tw,h);cx.clip();
  const off=(((md*pm)%512)+512)%512;for(let y=off-512;y<h;y+=512)for(let x=L;x<L+tw;x+=512)cx.drawImage(snow,x,y);
  g=cx.createLinearGradient(L,0,L+tw,0);g.addColorStop(0,'rgba(70,110,170,.35)');g.addColorStop(.14,'rgba(70,110,170,0)');g.addColorStop(.86,'rgba(70,110,170,0)');g.addColorStop(1,'rgba(70,110,170,.35)');cx.fillStyle=g;cx.fillRect(L,0,tw,h);
  cx.restore();
  // scenery on banks
  cx.textAlign='center';cx.textBaseline='middle';
  for(let b=Math.floor(dmin/3)-1;b<=dmax/3+1;b++){const y=py-(b*3+hs(b)*2-md)*pm;
    for(const sd of[-1,1]){const r=hs(b*7+sd*13);if(r>.8)continue;cx.font=(pm*(r>.55?1.7:1.2))+'px serif';
      cx.fillText(r>.7?'🪨':'🌲',sd<0?L-bank*(.15+hs(b+sd)*.55):L+tw+bank*(.15+hs(b+sd)*.55),y)}}
  // objects
  for(let c=Math.floor(dmin/5)-1;c<=dmax/5+1;c++)for(const o of chunk(c)){
    if(mr.got.has(o.id)&&o.t!=='J'&&o.t!=='S')continue;const y=py-(o.d-md)*pm,x=mid+o.x*tw/2;if(y<-pm*2||y>h+pm*2)continue;
    cx.globalAlpha=mr.hit.has(o.id)?.4:1;
    if(o.t==='S'){cx.save();cx.shadowColor='#ffd43b';cx.shadowBlur=14;g=cx.createLinearGradient(0,y-pm,0,y+pm);g.addColorStop(0,'#ffe066');g.addColorStop(1,'#ff922b');cx.fillStyle=g;cx.beginPath();cx.roundRect(x-pm*1.2,y-pm,pm*2.4,pm*2,pm*.3);cx.fill();cx.restore();
      cx.fillStyle='#fff';for(let i=0;i<3;i++){const yy=y+pm*.6-i*pm*.6;cx.beginPath();cx.moveTo(x,yy-pm*.3);cx.lineTo(x+pm*.5,yy+pm*.15);cx.lineTo(x-pm*.5,yy+pm*.15);cx.fill()}}
    else if(o.t==='J'){g=cx.createLinearGradient(0,y+pm,0,y-pm);g.addColorStop(0,'#6aa6dd');g.addColorStop(1,'#f2fbff');cx.fillStyle=g;cx.strokeStyle='#2b6cb0';cx.lineWidth=2.5;
      cx.beginPath();cx.moveTo(x-pm*1.1,y+pm*.9);cx.lineTo(x+pm*1.1,y+pm*.9);cx.lineTo(x+pm*.8,y-pm*.9);cx.lineTo(x-pm*.8,y-pm*.9);cx.closePath();cx.fill();cx.stroke();
      cx.fillStyle='#fff';cx.fillRect(x-pm*.8,y-pm*.95,pm*1.6,pm*.18)}
    else{cx.fillStyle='rgba(20,50,90,.18)';cx.beginPath();cx.ellipse(x,y+pm*.45,pm*.5,pm*.18,0,0,7);cx.fill();cx.font=(pm*1.25)+'px serif';cx.fillStyle='#000';cx.fillText(o.t,x,y)}
    cx.globalAlpha=1}
  const lead=R.rank&&R.rank[0]&&dd(R.rank[0])>5?R.rank[0].i:0;
  const sled=(x,y,p,crash,a,lift)=>{cx.globalAlpha=a*(lift?.25:.18);cx.fillStyle='#0a2447';cx.beginPath();cx.ellipse(x,y+pm*.3,pm*(.55-lift/pm*.12),pm*.22,0,0,7);cx.fill();
    cx.globalAlpha=a;y-=lift;const sc=1+lift/pm*.14;cx.save();cx.translate(x,y);cx.scale(sc,sc);
    cx.fillStyle=COL[p.i];cx.strokeStyle='#1b0a3c';cx.lineWidth=3;cx.beginPath();cx.ellipse(0,pm*.12,pm*.55,pm*.4,0,0,7);cx.fill();cx.stroke();
    cx.font=(pm*.8)+'px serif';cx.fillStyle='#000';cx.fillText(crash?'😵':p.e,crash?Math.sin(now/40)*3:0,-pm*.05);
    if(p.i===lead){cx.font=(pm*.7)+'px serif';cx.fillText('👑',0,-pm*.75)}cx.restore();
    const ny=y-pm*(p.i===lead?1.2:.85)*sc;cx.font='900 12px Nunito';cx.lineWidth=4;cx.strokeStyle='#1b0a3c';cx.fillStyle='#fff';cx.strokeText(p.n,x,ny);cx.fillText(p.n,x,ny);cx.globalAlpha=1};
  for(const p of R.list){if(p.i===me||p.w)continue;const o=RP[p.i];if(!o)continue;const y=py-(o.d-md)*pm;if(y>-pm*3&&y<h+pm*3)sled(mid+o.x*tw/2,y,p,p.c,.9,p.j?pm*2.2*Math.abs(Math.sin(now/260)):0)}
  if(R.me&&!R.me.w)sled(mid+mr.x*tw/2,py,R.me,mr.st>0,1,mr.air?Math.sin(Math.PI*mr.at/1.1)*pm*2.6:0);
  // speed streaks + snowfall + vignette
  if(mr.v>15&&R.ph==='run'){cx.strokeStyle='rgba(255,255,255,.5)';cx.lineWidth=2;cx.beginPath();for(let i=0;i<12;i++){const x=L+Math.random()*tw,y=Math.random()*h;cx.moveTo(x,y);cx.lineTo(x,y+30+Math.random()*30)}cx.stroke()}
  cx.fillStyle='rgba(255,255,255,.75)';for(const f of flakes){f.y+=(.04+f.s*.06+mr.v*.004)*dt/1000;f.x+=Math.sin(now/700+f.s*9)*.0004;if(f.y>1)f.y-=1;cx.beginPath();cx.arc(((f.x%1)+1)%1*w,f.y*h,1+f.s*1.8,0,7);cx.fill()}
  g=cx.createRadialGradient(w/2,h/2,h*.35,w/2,h/2,h*.85);g.addColorStop(0,'rgba(10,20,50,0)');g.addColorStop(1,'rgba(10,20,50,.45)');cx.fillStyle=g;cx.fillRect(0,0,w,h);
  // HUD
  const rem=R.tl-(now-R.tr);cx.textAlign='center';cx.textBaseline='middle';
  if(R.ph==='run'){txt(Math.round(md)+' m',w/2,48,34);const pos=R.rank?R.rank.findIndex(p=>p.i===me)+1:0;if(pos)txt('#'+pos+' of '+R.rank.length,w/2,86,20,'#fff');
    cx.fillStyle='#1b0a3c';cx.fillRect(w/2-80,106,160,8);cx.fillStyle='#ff6fb5';cx.fillRect(w/2-80,106,160*Math.max(0,rem/RMS),8);
    if(RMS-rem<900)txt('GO!',w/2,h*.4,90);if(mr.air)txt('WHEEE! 🚀',w/2,h*.28,36,'#7dd3fc');else if(mr.bo>0&&mr.v>18)txt('SPEEEED! ⚡',w/2,h*.28,32,'#ffd43b')}
  if(R.ph==='count')txt(Math.max(1,Math.ceil(rem/1000)),w/2,h*.4,110);
  if(R.ph==='run'&&R.me&&R.me.w)txt('Race in progress. You start next round!',w/2,h*.4,22,'#fff');
}
draw();
